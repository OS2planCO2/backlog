name: "Udviklingsønske"
description: "Foreslå en ny funktion eller forbedring af OS2planCO2."
title: "[Udviklingsønske]: "
body:
  - type: markdown
    attributes:
      value: |
        Beskriv et behov i arbejdet med OS2planCO2-pluginet til QGIS.
        Søg først i [eksisterende sager](https://github.com/OS2planCO2/backlog/issues?q=is%3Aissue), også de lukkede.
        Ønsket behandles efter projektets [retningslinjer for bidrag](https://github.com/OS2planCO2/backlog/blob/main/CONTRIBUTING.md).
        Du behøver ikke beskrive den tekniske løsning. Opfølgning sker i sagen via din GitHub-konto.
        Del kun oplysninger og filer, som må offentliggøres.

  - type: textarea
    id: current_situation
    attributes:
      label: Nuværende situation og behov
      description: Beskriv arbejdsgangen i QGIS, problemet og den berørte del af OS2planCO2.
      placeholder: |
        I arbejdet med lokalplaner forsøger jeg at ...
        I dag gør jeg ...
        Begrænsningen er ...
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Ønsket ændring
      description: Hvad vil du gerne kunne gøre? Beskriv det ønskede resultat fra brugerens perspektiv. Et konkret løsningsforslag er velkomment, men ikke nødvendigt.
      placeholder: "Jeg ønsker at kunne ... Resultatet skal gøre det muligt at ..."
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: Værdi og målgruppe
      description: Hvem har behovet, hvor ofte opstår det, og hvilken forskel vil ændringen gøre for planlægningen eller vurderingen af CO₂-aftryk?
      placeholder: |
        Ændringen vil gavne ...
        Behovet opstår ...
        Den forventede gevinst er ...
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: Eksempler og afgrænsning
      description: Beskriv konkrete anvendelsesscenarier og eventuelle krav til data eller resultater. Angiv gerne, hvad ønsket ikke behøver at omfatte. Vedhæft skærmbilleder, skitser eller links.
      placeholder: |
        Eksempel fra en planlægningsopgave:
        Relevante data eller beregningsindstillinger:
        Forventet resultat:
        Afgrænsning og relaterede sager:
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativer og nuværende omvej
      description: Kan opgaven løses på anden måde i dag? Beskriv eventuelt manuelt arbejde eller andre værktøjer.
    validations:
      required: false

  - type: textarea
    id: timing
    attributes:
      label: Tidsmæssigt behov og afhængigheder
      description: Angiv en eventuel frist og begrund den. Beskriv afhængigheder til andre opgaver. Oplysningerne indgår i prioriteringen.
    validations:
      required: false

  - type: input
    id: organization
    attributes:
      label: Kommune eller organisation (valgfrit)
      description: Kan hjælpe med at forstå anvendelsen. Opfølgning sker via din GitHub-konto.
      placeholder: "Kommune, rådgiver eller anden organisation"
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Tjekliste
      options:
        - label: Jeg har undersøgt, om udviklingsønsket allerede findes i en eksisterende sag.
          required: true
        - label: Jeg har beskrevet ønsket sagligt og respektfuldt.
          required: true
