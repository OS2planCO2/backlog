name: "Brugerhistorie (User Story)"
description: "Beskriv et brugerbehov i OS2planCO2 med testbare acceptkriterier."
title: "[Brugerhistorie]: "
body:
  - type: markdown
    attributes:
      value: |
        En brugerhistorie beskriver, hvem der har et behov i OS2planCO2-pluginet til QGIS, hvad brugeren vil opnå, og hvorfor.
        Brug formen **Som [rolle] ønsker jeg at [mål], så jeg kan [værdi]**.
        Acceptkriterier beskriver det observerbare resultat med **Givet [kontekst], Når [handling], Så [resultat]**.
        Søg først i [eksisterende sager](https://github.com/OS2planCO2/backlog/issues?q=is%3Aissue).
        Del kun oplysninger og filer, som må offentliggøres. Opfølgning sker i sagen via din GitHub-konto.

  - type: textarea
    id: user_story
    attributes:
      label: Brugerhistorie
      description: Beskriv ét afgrænset brugerbehov og den værdi, det skaber.
      placeholder: |
        Som planlægger
        ønsker jeg at kunne se CO₂-resultater for et valgt delområde
        så jeg kan vurdere delområdets bidrag til lokalplanens samlede aftryk.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptkriterier
      description: Angiv testbare kriterier. Beskriv relevante normale forløb og fejlsituationer. Ved beregninger angives testdata, indstillinger, forventet tal, enhed og eventuel tolerance.
      placeholder: |
        Kriterium 1:
        Givet et QGIS-testprojekt med to delområder og dokumenterede referenceværdier
        Når jeg vælger det ene delområde og viser dets CO₂-resultater
        Så vises kun resultater for det valgte delområde med den aftalte enhed og tolerance.

        Kriterium 2:
        Givet at der ikke er valgt et delområde
        Når jeg forsøger at vise resultater for et delområde
        Så får jeg en forståelig besked om at vælge et delområde.

        Konkret testdatasæt, referenceværdier, enhed og tolerance:
    validations:
      required: true

  - type: textarea
    id: additional_information
    attributes:
      label: Kontekst, afgrænsning og afhængigheder
      description: Angiv relevante lag, beregningsindstillinger, forudsætninger og relaterede sager. Beskriv gerne, hvad der ligger uden for historien.
      placeholder: |
        Arbejdsgang og forudsætninger:
        Indgår i historien:
        Indgår ikke:
        Relaterede sager og afhængigheder:
    validations:
      required: false

  - type: textarea
    id: attachments
    attributes:
      label: Testdata og vedhæftninger
      description: Vedhæft eksempelprojekt, data, skitser eller skærmbilleder ved at trække filer ind i feltet eller tilføje links. Brug kun materiale, som må offentliggøres.
    validations:
      required: false

  - type: textarea
    id: test_phase
    attributes:
      label: Testvejledning til den videre behandling
      description: Dette er vejledning til den ansvarlige for løsningen. Testresultater tilføjes som kommentarer, når sagen er klar til brugertest.
      value: |
        Ved brugertest dokumenteres følgende i en kommentar:
        - [ ] Version af QGIS, OS2planCO2 og operativsystem
        - [ ] Testtrin, testdata og relevante beregningsindstillinger
        - [ ] Forventede og faktiske resultater for hvert acceptkriterium
        - [ ] Enheder og eventuel tolerance ved beregninger
        - [ ] Afvigelser samt hvilke acceptkriterier der er bestået eller ikke bestået

        Bevar brugerhistorien og de aftalte acceptkriterier som grundlag for testen.
        Eventuelle ændringer i omfang eller kriterier dokumenteres i kommentarer.
    validations:
      required: false
